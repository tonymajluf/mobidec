services:
  - type: web
    name: gmobidec
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: demos
      - key: FM_BASE_URL
        sync: tonymajluf.ddns.net/fmi/webd
      - key: FM_DATABASE
        value: productos
      - key: FM_LAYOUT
        value: productos
      - key: FM_USERNAME
        sync: web
      - key: FM_PASSWORD
        sync: webcatalogo
      - key: FM_PHOTO_MODE
        value: container
